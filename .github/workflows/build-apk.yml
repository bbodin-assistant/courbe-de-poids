name: Build and Validate Android APK

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  version-validation:
    name: Validate application version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate version format and release increment
        run: |
          set -euo pipefail
          current_name="$(grep -E 'configuredVersionName|versionName' app/build.gradle | grep -oE '[0-9]+\.[0-9]+(-[0-9]+)?' | tail -n 1)"
          current_code="$(grep -E 'versionCode' app/build.gradle | grep -oE '[0-9]+' | head -n 1)"
          test -n "$current_name"
          test -n "$current_code"
          printf '%s\n' "$current_name" | grep -qE '^[0-9]+\.[0-9]+(-[0-9]+)?$'
          test "$current_code" -ge 1
          previous_name="$(git show HEAD^:app/build.gradle 2>/dev/null | grep -E 'configuredVersionName|versionName' | grep -oE '[0-9]+\.[0-9]+(-[0-9]+)?' | tail -n 1 || true)"
          previous_code="$(git show HEAD^:app/build.gradle 2>/dev/null | grep -E 'versionCode' | grep -oE '[0-9]+' | head -n 1 || true)"
          echo "Version courante : $current_name (code $current_code)"
          echo "Version précédente : $previous_name (code $previous_code)"
          if [ -n "$previous_name" ] && [ "$current_name" != "$previous_name" ]; then
            if [ -z "$previous_code" ] || [ "$current_code" -le "$previous_code" ]; then
              echo "Une nouvelle versionName doit avoir un versionCode strictement supérieur."
              exit 1
            fi
          elif [ -n "$previous_name" ] && [ -n "$previous_code" ] && [ "$current_code" != "$previous_code" ]; then
            echo "versionCode a changé sans changement de versionName."
            exit 1
          fi

  build-apk:
    name: Build and publish signed Android packages
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Read application version
        id: version
        run: |
          set -euo pipefail
          version="$(grep -E 'configuredVersionName' app/build.gradle | grep -oE '[0-9]+\.[0-9]+(-[0-9]+)?' | tail -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing secret: ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing secret: ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing secret: ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing secret: ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/courbe-de-poids-release.jks"
          test -s "$RUNNER_TEMP/courbe-de-poids-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/courbe-de-poids-release.jks" -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >/dev/null

      - name: Build signed release APK and AAB
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/courbe-de-poids-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle assembleRelease bundleRelease -PVERSION_NAME="$VERSION_NAME" --stacktrace

      - name: Build instrumented test APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
        run: gradle assembleDebugAndroidTest -PVERSION_NAME="$VERSION_NAME" --stacktrace

      - name: Verify signed APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$AAPT"
          test -n "$APKSIGNER"
          "$AAPT" dump badging "$APK" | grep -F "versionName='$VERSION_NAME'"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload version metadata
        run: echo "${{ steps.version.outputs.version }}" > app-version.txt

      - name: Publish signed Android packages
        uses: actions/upload-artifact@v4
        with:
          name: courbe-de-poids-android-${{ steps.version.outputs.version }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app-version.txt
          if-no-files-found: error
          retention-days: 30

  instrumented-tests:
    name: Instrumented acceptance tests of debug APK
    needs: build-apk
    if: ${{ needs.build-apk.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download published Android packages
        uses: actions/download-artifact@v5
        with:
          name: courbe-de-poids-android-${{ needs.build-apk.outputs.version }}
          path: published-android
      - name: Verify published packages
        run: |
          set -euo pipefail
          test "${{ needs.build-apk.outputs.version }}" = "$(cat published-android/app-version.txt)"
          test -s published-android/app/build/outputs/apk/release/app-release.apk
          test -s published-android/app/build/outputs/bundle/release/app-release.aab
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run instrumented acceptance scenarios
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: |
            bash scripts/run-instrumented-tests.sh
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports-${{ needs.build-apk.outputs.version }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            instrumentation.log
            instrumentation-logcat.txt
          if-no-files-found: warn
          retention-days: 30
