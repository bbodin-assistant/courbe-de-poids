name: Build and Validate Android APK

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  version-gate:
    name: Check release version changed
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Compare application version with previous commit
        id: version
        run: |
          set -euo pipefail
          current="$(git show HEAD:app/build.gradle | grep -E "versionName" | grep -oE "[0-9]+.[0-9]+(-[0-9]+)?" | tail -n 1)"
          previous="$(git show HEAD^:app/build.gradle 2>/dev/null | grep -E "versionName" | grep -oE "[0-9]+.[0-9]+(-[0-9]+)?" | tail -n 1 || true)"
          if [ -z "$current" ]; then
            echo "Impossible de déterminer la version courante dans app/build.gradle."
            exit 1
          fi
          echo "Version courante : $current"
          echo "Version précédente : ${previous:-<absente>}"
          if [ "$current" = "$previous" ]; then
            echo "La version n'a pas changé : build et tests ignorés."
            exit 0
          fi
          echo "La version a changé : $previous -> $current"
          echo "version=$current" >> "$GITHUB_OUTPUT"

  build-apk:
    name: Build and publish APK
    needs: version-gate
    if: ${{ needs.version-gate.outputs.version != '' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.version-gate.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        env:
          VERSION_NAME: ${{ needs.version-gate.outputs.version }}
        run: gradle assembleDebug -PVERSION_NAME="$VERSION_NAME" --stacktrace
      - name: Build instrumented test APK
        env:
          VERSION_NAME: ${{ needs.version-gate.outputs.version }}
        run: gradle assembleDebugAndroidTest -PVERSION_NAME="$VERSION_NAME" --stacktrace
      - name: Verify APK version
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "versionName='${{ needs.version-gate.outputs.version }}'"
      - name: Upload version metadata
        run: echo "${{ needs.version-gate.outputs.version }}" > app-version.txt
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: courbe-de-poids-apk-${{ needs.version-gate.outputs.version }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app-version.txt
          if-no-files-found: error
          retention-days: 30

  instrumented-tests:
    name: Instrumented acceptance tests of published APK
    needs: build-apk
    if: ${{ needs.build-apk.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download published APK
        uses: actions/download-artifact@v5
        with:
          name: courbe-de-poids-apk-${{ needs.build-apk.outputs.version }}
          path: published-apk
      - name: Verify published APK
        run: |
          test "${{ needs.build-apk.outputs.version }}" = "$(cat published-apk/app-version.txt)"
          test -s published-apk/app/build/outputs/apk/debug/app-debug.apk
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run instrumented acceptance scenarios against published APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r published-apk/app/build/outputs/apk/debug/app-debug.apk
            adb install -r published-apk/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant fr.bbodin.courbedepoids android.permission.POST_NOTIFICATIONS || true
            adb logcat -c

            adb shell am instrument -w -r -e package fr.bbodin.courbedepoids fr.bbodin.courbedepoids.test/androidx.test.runner.AndroidJUnitRunner > instrumentation.log 2>&1
            instrument_exit=$?
            cat instrumentation.log

            if grep -q "INSTRUMENTATION_RESULT: shortMsg=Process crashed." instrumentation.log; then
              echo "Instrumentation process crashed."
              adb logcat -d -v threadtime > instrumentation-logcat.txt
              exit 1
            fi
            if grep -q "INSTRUMENTATION_STATUS_CODE: -2" instrumentation.log; then
              echo "Instrumentation reported a process crash."
              adb logcat -d -v threadtime > instrumentation-logcat.txt
              exit 1
            fi
            if [ "$instrument_exit" -ne 0 ]; then
              echo "Instrumentation command failed with exit code $instrument_exit."
              adb logcat -d -v threadtime > instrumentation-logcat.txt
              exit "$instrument_exit"
            fi
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports-${{ needs.build-apk.outputs.version }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            instrumentation.log
            instrumentation-logcat.txt
          if-no-files-found: warn
          retention-days: 30
