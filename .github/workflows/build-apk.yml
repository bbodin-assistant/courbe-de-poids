name: Build and Validate Android APK

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  version-validation:
    name: Validate application version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate version format and release increment
        run: |
          set -euo pipefail
          current_name="$(grep -E 'configuredVersionName|versionName' app/build.gradle | grep -oE '[0-9]+\.[0-9]+(-[0-9]+)?' | tail -n 1)"
          current_code="$(grep -E 'versionCode' app/build.gradle | grep -oE '[0-9]+' | head -n 1)"
          test -n "$current_name" && test -n "$current_code"
          printf '%s\n' "$current_name" | grep -qE '^[0-9]+\.[0-9]+(-[0-9]+)?$'
          test "$current_code" -ge 1
          previous_name="$(git show HEAD^:app/build.gradle 2>/dev/null | grep -E 'configuredVersionName|versionName' | grep -oE '[0-9]+\.[0-9]+(-[0-9]+)?' | tail -n 1 || true)"
          previous_code="$(git show HEAD^:app/build.gradle 2>/dev/null | grep -E 'versionCode' | grep -oE '[0-9]+' | head -n 1 || true)"
          echo "Version courante : $current_name (code $current_code)"
          echo "Version précédente : $previous_name (code $previous_code)"
          if [ -n "$previous_name" ] && [ "$current_name" != "$previous_name" ]; then
            if [ -z "$previous_code" ] || [ "$current_code" -le "$previous_code" ]; then
              echo "Une nouvelle versionName doit avoir un versionCode strictement supérieur."
              exit 1
            fi
          elif [ -n "$previous_name" ] && [ -n "$previous_code" ] && [ "$current_code" != "$previous_code" ]; then
            echo "versionCode a changé sans changement de versionName."
            exit 1
          fi

  build-debug:
    name: Build and publish debug APKs
    needs: version-validation
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Read application version
        id: version
        run: |
          set -euo pipefail
          version="$(grep -E 'configuredVersionName' app/build.gradle | grep -oE '[0-9]+\.[0-9]+(-[0-9]+)?' | tail -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build debug APK and instrumentation test APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
        run: gradle assembleDebug assembleDebugAndroidTest -PVERSION_NAME="$VERSION_NAME" --stacktrace
      - name: Verify debug packages
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Publish debug packages
        uses: actions/upload-artifact@v4
        with:
          name: courbe-de-poids-debug-${{ steps.version.outputs.version }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 30

